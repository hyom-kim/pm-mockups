<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversational Search — Concept Demo</title>
<style>
  :root{
    --ai-1:#5EE7DF;
    --ai-2:#B490F0;
    --ai-3:#F45FA0;
    --ai-4:#FFA45E;
    --posh:#7C1D3E;
    --ink:#1A1A1A;
    --paper:#F7F5F2;
    --card:#ffffff;
    --line:#E7E2DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 16px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .head{
    text-align:center;
    max-width:520px;
    margin-bottom:18px;
  }
  .head h1{
    font-size:19px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .head p{
    margin:6px 0 0;
    font-size:12.5px;
    color:#8a8378;
  }

  .dots{
    display:flex;
    gap:8px;
    margin:16px 0 22px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#DDD6CC;
    transition:all .25s;
  }
  .dot.active{
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    width:22px;border-radius:5px;
  }

  /* ---- layout: phone + caption panel side by side ---- */
  .stage-row{
    display:flex;
    align-items:center;
    gap:36px;
    max-width:920px;
    width:100%;
    justify-content:center;
  }

  .phone-wrap{
    position:relative;
    width:280px;
    flex:0 0 auto;
  }
  .phone{
    width:280px;
    border-radius:42px;
    background:#0c0c0c;
    padding:10px;
    box-shadow:0 24px 60px -18px rgba(20,10,5,.35), 0 2px 8px rgba(0,0,0,.15);
    position:relative;
  }
  .screen{
    position:relative;
    width:100%;
    aspect-ratio:1180/2556;
    border-radius:32px;
    overflow:hidden;
    background:#fff;
    isolation:isolate;
  }
  .stage-media{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .25s ease;
  }
  .stage-media.active{opacity:1;}

  /* masks the real recording-indicator dot baked into the source footage */
  .rec-mask{
    position:absolute;
    left:31.9%; top:3.44%;
    width:4.6%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    background:#0c0c0c;
    border-radius:50%;
    z-index:20;
    pointer-events:none;
  }

  /* tap target over the mic/voice icon on the home screen */
  .voice-tap{
    position:absolute;
    left:78.4%; top:9.5%;
    width:9%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:30;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(180,90,190,.55);
    animation:tapPulse 1.8s ease-out infinite;
  }
  @keyframes tapPulse{
    0%{box-shadow:0 0 0 0 rgba(180,90,190,.45);}
    70%{box-shadow:0 0 0 14px rgba(180,90,190,0);}
    100%{box-shadow:0 0 0 0 rgba(180,90,190,0);}
  }
  .voice-tap-hint{
    position:absolute;
    left:50%; top:-30px;
    transform:translateX(-50%);
    font-size:10.5px;
    color:#fff;
    background:rgba(0,0,0,.6);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
    z-index:31;
    pointer-events:none;
  }

  /* ---- AI response glass bubble, sits inside the phone screen ---- */
  .ai-bubble{
    position:absolute;
    left:6%; right:6%;
    top:13%;
    z-index:25;
    padding:10px 14px;
    font-size:12.5px;
    line-height:1.45;
    font-weight:600;
    color:var(--posh);
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-radius:16px;
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 10px 28px -10px rgba(0,0,0,.28);
    opacity:0;
    transform:translateY(-8px) scale(.97);
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:none;
  }
  .ai-bubble.show{opacity:1; transform:translateY(0) scale(1);}

  /* ---- caption panel (kinetic word-by-word), right of phone ---- */
  .caption-panel{
    flex:1 1 260px;
    min-width:220px;
    max-width:340px;
    min-height:160px;
    display:flex;
    align-items:center;
  }
  .caption-text{
    font-size:22px;
    font-weight:700;
    line-height:1.32;
    letter-spacing:-0.01em;
    color:#2a2a2a;
  }
  .caption-text .word{
    display:inline-block;
    opacity:0;
    filter:blur(2px);
    transform:translateY(6px);
    animation:wordIn .42s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .caption-text .word.dim{
    opacity:.32 !important;
    filter:none !important;
    transform:none !important;
    animation:none !important;
    background:none !important;
    -webkit-text-fill-color:currentColor !important;
  }
  .caption-text .word.hi{
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  @keyframes wordIn{
    to{opacity:1; filter:blur(0); transform:translateY(0);}
  }

  /* ---- controls under phone ---- */
  .controls{
    margin-top:26px;
    display:flex;
    gap:10px;
  }
  .btn{
    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:22px;
    border:1px solid var(--line);
    background:#fff;
    color:#3a352d;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    color:#fff;
    border:none;
  }
  .btn:disabled{opacity:.35;cursor:default;}

  .stage-label{
    margin-top:14px;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#b0a99c;
  }

  .finale-line{
    display:none;
    margin-top:10px;
    font-size:15px;
    font-style:italic;
    font-weight:600;
    color:var(--posh);
    text-align:center;
    max-width:420px;
  }

  @media (max-width:720px){
    .stage-row{flex-direction:column; gap:18px;}
    .caption-panel{
      max-width:280px;
      min-height:auto;
      text-align:center;
      justify-content:center;
    }
    .caption-text{font-size:19px;}
  }
</style>
</head>
<body>

  <div class="head">
    <h1>Conversational Search</h1>
    <p>Voice. Ambient. Adaptive.</p>
  </div>

  <div class="dots" id="dots"></div>

  <div class="stage-row">
    <div class="phone-wrap">
      <div class="phone" id="phone">
        <div class="screen" id="screen">
          <img class="stage-media active" id="homeImg" src="home_start.png" alt="home">
          <video class="stage-media" id="vid" playsinline muted></video>
          <div class="rec-mask"></div>
          <div class="ai-bubble" id="aiBubble"></div>
          <div class="voice-tap" id="voiceTap" title="Tap to start">
            <div class="voice-tap-hint">Tap the mic</div>
          </div>
        </div>
      </div>
    </div>

    <div class="caption-panel">
      <div class="caption-text" id="captionText"></div>
    </div>
  </div>

  <div class="stage-label" id="stageLabel">Home — tap the voice icon to start</div>
  <div class="finale-line" id="finaleLine">It keeps going — right there with you, until you find the one.</div>

  <div class="controls">
    <button class="btn" id="prevBtn">◀ Prev</button>
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn primary" id="nextBtn">Next ▶</button>
  </div>

<script>
/* ---------------- stage data ---------------- */
// each stage after the home screen is a captured video clip.
// captionWindow is [startFraction, endFraction] of that clip's own duration
// during which the kinetic caption should be revealed.
const stages = [
  {
    id:'home',
    label:'Home — tap the voice icon to start',
    type:'image',
  },
  {
    id:'intro',
    label:'Ambient listening — home screen, no dedicated UI',
    type:'video',
    src:'voice_intro.mp4',
    caption:"Ugh, you know — those pants that get wider and wider toward the bottom? I don't know what they're called, but I want jeans like that. Kinda faded black would be nice. And something where you can't see what's underneath when I sit down, so it's comfortable.",
    captionWindow:[0.024, 0.637],
    aiBubbleAtStart:null,
    holdAfterMs:300,
  },
  {
    id:'start',
    label:'Query resolved — native results, no chat UI',
    type:'video',
    src:'stage_start.mp4',
    caption:"Hmm, these are too clean... anything more street?",
    captionWindow:[0.199, 0.378],
    aiBubbleAtStart:null,
    holdAfterMs:300,
  },
  {
    id:'colorreq',
    label:'Refining — still just talking, no new screen',
    type:'video',
    src:'stage_colorreq.mp4',
    caption:"Wait, why am I getting blue jeans? I searched black.",
    captionWindow:[0.326, 0.586],
    // shown the moment THIS clip starts (reaction to the previous request), not at the end of the previous clip
    aiBubbleAtStart:{ text:"I made it more edgy. Distressed and ripped.", durationMs:3000 },
    holdAfterMs:300,
  },
  {
    id:'colorapplied',
    label:'Adapting the results in place',
    type:'video',
    src:'stage_colorapplied.mp4',
    caption:"Oh okay, I like these better.",
    captionWindow:[0.325, 0.519],
    aiBubbleAtStart:{ text:"Let me narrow it down with the color filter.", durationMs:3000 },
    holdAfterMs:300,
  },
  {
    id:'pdp',
    label:'Into the listing, and back — still the same session',
    type:'video',
    src:'stage_pdp.mp4',
    caption:"Yeah, I like this style.",
    captionWindow:[0.192, 0.346],
    aiBubbleAtStart:null,
    holdAfterMs:0,
  },
];

let current = 0;
let captionRAF = null;
let advanceTimer = null;
let bubbleShowTimer = null;
let bubbleHideTimer = null;

const homeImg = document.getElementById('homeImg');
const vid = document.getElementById('vid');
const voiceTap = document.getElementById('voiceTap');
const aiBubble = document.getElementById('aiBubble');
const captionText = document.getElementById('captionText');
const stageLabel = document.getElementById('stageLabel');
const finaleLine = document.getElementById('finaleLine');
const dotsWrap = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

/* build progress dots */
stages.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0 ? ' active' : '');
  d.id = 'dot-'+i;
  dotsWrap.appendChild(d);
});

function setDots(n){
  stages.forEach((s,i)=>{
    document.getElementById('dot-'+i).classList.toggle('active', i===n);
  });
}

function clearCaption(){
  if(captionRAF) cancelAnimationFrame(captionRAF);
  captionText.innerHTML = '';
}

function buildCaptionSpans(text){
  captionText.innerHTML = '';
  const words = text.split(' ');
  return words.map(w=>{
    const span = document.createElement('span');
    span.className = 'word dim';
    span.textContent = w + '\u00A0';
    captionText.appendChild(span);
    return span;
  });
}

function driveCaption(videoEl, stage){
  const spans = buildCaptionSpans(stage.caption);
  const [wf, ef] = stage.captionWindow;
  let revealed = 0;
  function tick(){
    const dur = videoEl.duration || 0;
    if(dur>0){
      const t0 = wf*dur, t1 = ef*dur;
      const progress = Math.max(0, Math.min(1, (videoEl.currentTime - t0)/Math.max(0.01,(t1-t0))));
      const target = Math.floor(progress * spans.length);
      while(revealed < target && revealed < spans.length){
        spans[revealed].classList.remove('dim');
        spans[revealed].style.animation = 'none';
        void spans[revealed].offsetWidth;
        spans[revealed].style.animation = '';
        revealed++;
      }
    }
    captionRAF = requestAnimationFrame(tick);
  }
  tick();
}

function showAiBubble(text){
  aiBubble.textContent = text;
  aiBubble.classList.add('show');
}
function hideAiBubble(){
  aiBubble.classList.remove('show');
}

function goToStage(i){
  if(i<0 || i>=stages.length) return;
  clearCaption();
  hideAiBubble();
  if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; }
  if(bubbleShowTimer){ clearTimeout(bubbleShowTimer); bubbleShowTimer=null; }
  if(bubbleHideTimer){ clearTimeout(bubbleHideTimer); bubbleHideTimer=null; }
  current = i;
  const stage = stages[i];
  const isLastStage = (i === stages.length-1);
  setDots(i);
  stageLabel.textContent = stage.label;
  prevBtn.disabled = (i===0);
  nextBtn.style.display = isLastStage ? 'none' : 'inline-block';
  finaleLine.style.display = isLastStage ? 'block' : 'none';

  if(stage.type==='image'){
    vid.pause();
    vid.classList.remove('active');
    homeImg.classList.add('active');
    voiceTap.style.display = 'block';
    return;
  }

  voiceTap.style.display = 'none';
  homeImg.classList.remove('active');
  vid.classList.add('active');

  // Cutting to the next stage is ALWAYS scheduled (unless this is the final
  // stage) — no matter whether this stage was reached via autoplay, or the
  // person clicked Next/Prev manually mid-sequence. One deterministic
  // setTimeout the moment we know the clip's real duration; not tied to the
  // rAF caption loop (can stall in a backgrounded tab) or 'ended' (may never
  // fire). Fires exactly once per stage load.
  let cutScheduled = false;
  function scheduleCut(){
    if(cutScheduled || isLastStage) return;
    const dur = vid.duration;
    if(!dur || !isFinite(dur)) return;
    cutScheduled = true;
    const t1 = stage.captionWindow[1] * dur;
    const msUntilCut = Math.max(0, (t1 - vid.currentTime) * 1000) + 3000;
    advanceTimer = setTimeout(()=>{
      goToStage(i+1);
    }, msUntilCut);
  }

  vid.onloadedmetadata = scheduleCut;
  vid.oncanplay = ()=>{
    vid.play();
    if(stage.aiBubbleAtStart){
      showAiBubble(stage.aiBubbleAtStart.text);
      bubbleHideTimer = setTimeout(hideAiBubble, stage.aiBubbleAtStart.durationMs || 3000);
    }
    driveCaption(vid, stage);
    scheduleCut(); // in case loadedmetadata already fired before this handler was attached
  };
  vid.onended = ()=>{
    if(captionRAF){ cancelAnimationFrame(captionRAF); captionRAF=null; }
    if(!isLastStage && !advanceTimer){
      // safety net only — normally the scheduled cut above fires first
      advanceTimer = setTimeout(()=>{
        goToStage(i+1);
      }, stage.holdAfterMs || 0);
    }
  };
  vid.src = stage.src;
  vid.currentTime = 0;
  vid.load();
}

voiceTap.addEventListener('click', ()=>{
  goToStage(1);
});

prevBtn.addEventListener('click', ()=>{
  if(current>0) goToStage(current-1);
});
nextBtn.addEventListener('click', ()=>{
  if(current < stages.length-1) goToStage(current+1);
  else goToStage(0);
});
restartBtn.addEventListener('click', ()=>{
  goToStage(0);
});

goToStage(0);
</script>
</body>
</html>

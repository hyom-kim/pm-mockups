<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poshmark Voice Search Concept Demo</title>
<style>
  :root{
    --ai-1:#5EE7DF;
    --ai-2:#B490F0;
    --ai-3:#F45FA0;
    --ai-4:#FFA45E;
    --posh:#7C1D3E;
    --ink:#1A1A1A;
    --paper:#F7F5F2;
    --card:#ffffff;
    --line:#E7E2DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 16px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .head{
    text-align:center;
    max-width:420px;
    margin-bottom:18px;
  }
  .head h1{
    font-size:19px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .dots{
    display:flex;
    gap:8px;
    margin:16px 0 6px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#DDD6CC;
    transition:all .25s;
  }
  .dot.active{
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    width:22px;border-radius:5px;
  }

  .phone-wrap{
    position:relative;
    width:308px;
  }
  .phone{
    width:308px;
    border-radius:46px;
    background:#0c0c0c;
    padding:11px;
    box-shadow:0 24px 60px -18px rgba(20,10,5,.35), 0 2px 8px rgba(0,0,0,.15);
    position:relative;
  }
  .phone.ai-glow{
    background:linear-gradient(135deg,var(--ai-1),var(--ai-2),var(--ai-3),var(--ai-4));
    animation:glowShift 3s ease infinite;
  }
  @keyframes glowShift{
    0%,100%{filter:hue-rotate(0deg);}
    50%{filter:hue-rotate(25deg);}
  }
  .screen{
    position:relative;
    width:100%;
    aspect-ratio:1179/2556;
    border-radius:36px;
    overflow:hidden;
    background:#fff;
    isolation:isolate;
  }
  .notch{
    position:absolute;
    top:8px;left:50%;
    transform:translateX(-50%);
    width:34%;height:20px;
    background:#0c0c0c;
    border-radius:12px;
    z-index:50;
  }
  .stage-img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .stage{
    position:absolute;inset:0;
    display:none;
  }
  .stage.active{display:block;}

  /* ---- floating mic buttons ---- */
  .mic-fab{
    position:absolute;
    width:52px;height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px -4px rgba(180,60,140,.55);
    cursor:pointer;
    border:none;
    z-index:40;
  }
  .mic-fab svg{width:22px;height:22px;fill:#fff;}
  .mic-fab.small{width:40px;height:40px;}
  .mic-fab.small svg{width:17px;height:17px;}
  .mic-fab::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid rgba(180,90,190,.55);
    animation:pulseRing 1.8s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{transform:scale(.85);opacity:.9;}
    80%{transform:scale(1.35);opacity:0;}
    100%{opacity:0;}
  }

  #fab-1{right:6%;bottom:15.5%;}
  #fab-2{right:6%;bottom:8.5%;}

  .tap-hint{
    position:absolute;
    bottom:6px;left:50%;
    transform:translateX(-50%);
    font-size:10px;
    color:#fff;
    background:rgba(0,0,0,.55);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
    z-index:41;
    opacity:0;
    animation:fadeIn .3s .2s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}

  /* ---- stage 2: listening screen ---- */
  .listen-screen{
    position:absolute;inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    z-index:30;
  }
  .listen-top{
    display:flex;align-items:center;
    padding:34px 16px 0;
  }
  .listen-back{
    font-size:22px;color:#333;cursor:pointer;
    width:28px;
  }
  .listen-body{
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:0 22px;
    text-align:center;
  }
  .listen-caption{
    font-size:15px;
    line-height:1.55;
    color:#2a2a2a;
    min-height:80px;
    margin-bottom:22px;
  }
  .type-cursor{
    display:inline-block;
    width:2px;height:15px;
    background:#B490F0;
    margin-left:2px;
    animation:blink 0.9s step-end infinite;
    vertical-align:-2px;
  }
  @keyframes blink{50%{opacity:0;}}
  .word-pop{
    display:inline-block;
    opacity:0;
    transform:translateY(3px);
    animation:wordPop .5s ease-out forwards;
  }
  @keyframes wordPop{
    to{opacity:1; transform:translateY(0);}
  }
  .listening-word{
    font-size:13px;
    color:#8a8378;
    margin-bottom:18px;
    letter-spacing:.02em;
  }
  .orb{
    width:64px;height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--ai-1), var(--ai-2) 55%, var(--ai-3) 100%);
    box-shadow:0 6px 24px -4px rgba(150,80,180,.5);
    animation:orbPulse 1.4s ease-in-out infinite;
  }
  @keyframes orbPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  .bars{
    display:flex;align-items:flex-end;gap:4px;height:26px;margin-top:20px;
  }
  .bars span{
    width:4px;border-radius:3px;
    background:linear-gradient(180deg,var(--ai-2),var(--ai-3));
    animation:eq 1s ease-in-out infinite;
  }
  .bars span:nth-child(1){height:10px;animation-delay:0s;}
  .bars span:nth-child(2){height:22px;animation-delay:.15s;}
  .bars span:nth-child(3){height:14px;animation-delay:.3s;}
  .bars span:nth-child(4){height:24px;animation-delay:.45s;}
  .bars span:nth-child(5){height:9px;animation-delay:.6s;}
  @keyframes eq{
    0%,100%{transform:scaleY(.5);}
    50%{transform:scaleY(1);}
  }
  .auto-pill{
    position:absolute;
    bottom:26px;left:50%;transform:translateX(-50%);
    font-size:11px;color:#5b564d;
    background:#F1EEE8;
    padding:6px 14px;border-radius:20px;
    display:flex;align-items:center;gap:6px;
  }
  .auto-pill svg{width:11px;height:11px;fill:#4CAF6A;}

  /* ---- caption / chat bubbles on result screens ---- */
  .cap-bubble{
    position:absolute;
    left:6%;right:6%;
    background:rgba(255,255,255,.97);
    border-radius:16px;
    padding:10px 14px;
    font-size:12.5px;
    line-height:1.5;
    color:#2a2a2a;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.18);
    z-index:35;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .35s, transform .35s;
    border-left:3px solid transparent;
    border-image:linear-gradient(180deg,var(--ai-2),var(--ai-3)) 1;
  }
  .cap-bubble.show{opacity:1;transform:translateY(0);}
  .cap-bubble.fadeout{opacity:0;transform:translateY(-6px);}
  .cap-bubble.ai{top:15%;font-weight:600;color:var(--posh);}

  /* ---- stage 3: scrollable results + entry-listening tooltip ---- */
  .scroll-area{
    position:relative;
    width:100%;
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .scroll-area::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
  }
  .stage-img-scroll{
    display:block;
    width:100%;
  }
  .listen-tooltip{
    position:absolute;
    right:4%;
    bottom:17.5%;
    background:rgba(20,16,14,.85);
    color:#fff;
    font-size:11px;
    padding:6px 12px;
    border-radius:14px;
    z-index:42;
    opacity:0;
    transition:opacity .3s;
    white-space:nowrap;
  }
  .listen-tooltip.show{opacity:1;}

  .full-tap-catch{
    position:absolute;inset:0;
    z-index:45;
    cursor:pointer;
  }

  /* ---- outside-the-phone speech bubble (user talking out loud) ---- */
  .outside-bubble{
    margin-top:14px;
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 16px;
    font-size:13px;
    line-height:1.5;
    color:#2a2a2a;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.18);
    display:flex;
    gap:8px;
    align-items:flex-start;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .35s, transform .35s;
    pointer-events:none;
    min-height:52px;
  }
  .outside-bubble.show{opacity:1;transform:translateY(0);}
  .outside-ico{font-size:16px;line-height:1;}

  /* ---- controls under phone ---- */
  .controls{
    margin-top:20px;
    display:flex;
    gap:10px;
  }
  .btn{
    font-size:12.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:22px;
    border:1px solid var(--line);
    background:#fff;
    color:#3a352d;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--ai-2),var(--ai-3));
    color:#fff;
    border:none;
  }
  .btn:disabled{opacity:.35;cursor:default;}


</style>
</head>

    <div class="outside-bubble" id="outside-bubble">
      <span class="outside-ico">🗣️</span>
      <span id="outside-bubble-text"></span>
    </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prevStage()">◀ 이전</button>
    <button class="btn" onclick="restart()">처음부터</button>
    <button class="btn primary" id="nextBtn" onclick="nextStage()">다음 ▶</button>

<script>
  let stage = 1;
  const phrase1 = "You know those Hailey Bieber paparazzi pics everyone\u2019s been talking about lately? I love the jeans she\u2019s wearing in those. Can you find me something like that?";
  const phrase2 = "Hmm, I\u2019m not really feeling these... Do you have anything in a lighter wash?";

  function setDots(n){
    for(let i=1;i<=4;i++){
      document.getElementById('dot-'+i).classList.toggle('active', i===n);
    }
  }

  function showOnly(n){
    for(let i=1;i<=4;i++){
      document.getElementById('stage'+i).classList.toggle('active', i===n);
    }
    document.getElementById('phone').classList.toggle('ai-glow', n===2);
    setDots(n);
    document.getElementById('prevBtn').disabled = (n===1);
    document.getElementById('tapcatch').style.display='none';
  }

  function typeInto(el, text, speed, done){
    el.innerHTML = '<span class="type-cursor"></span>';
    let i=0;
    const timer = setInterval(()=>{
      i++;
      el.innerHTML = text.slice(0,i) + '<span class="type-cursor"></span>';
      if(i>=text.length){
        clearInterval(timer);
        if(done) setTimeout(done, 500);
      }
    }, speed);
  }

  function typeWords(el, text, wordDelay, done){
    el.innerHTML = '';
    const words = text.split(' ');
    let i = 0;
    function next(){
      if(i < words.length){
        const span = document.createElement('span');
        span.className = 'word-pop';
        span.textContent = words[i] + (i < words.length - 1 ? '\u00A0' : '');
        el.appendChild(span);
        i++;
        setTimeout(next, wordDelay);
      } else if(done){
        setTimeout(done, 600);
      }
    }
    next();
  }

  function toStage1(){ stage=1; showOnly(1); }

  function toStage2(){
    stage=2; showOnly(2);
    const cap = document.getElementById('listen-caption');
    setTimeout(()=>{
      typeWords(cap, phrase1, 260, ()=>{
        document.getElementById('tapcatch').style.display='block';
      });
    }, 400);
  }

  // when user taps the listening screen after typing finishes -> go to stage 3
  function onTapCatch(){
    if(stage===2){
      stage=3; showOnly(3);
      document.getElementById('scroll-area').scrollTop = 0;
      refineDone = false;
      refineTriggered = false;
      refining = false;
      const lt = document.getElementById('listen-tooltip');
      lt.classList.add('show');
      setTimeout(()=>lt.classList.remove('show'), 2500);
      flashAiGlow();
    } else if(stage===3 && refineDone){
      stage=4; showOnly(4);
      flashAiGlow();
    }
  }

  function flashAiGlow(){
    const phone = document.getElementById('phone');
    phone.classList.add('ai-glow');
    setTimeout(()=>phone.classList.remove('ai-glow'), 1400);
  }

  let refineDone = false;
  let refineTriggered = false;
  let refining = false;
  function startRefine(){
    if(refineDone || refining) return;
    refining = true;
    const ext = document.getElementById('outside-bubble');
    const extText = document.getElementById('outside-bubble-text');
    extText.innerHTML = '<span class="type-cursor"></span>';
    ext.classList.add('show');
    setTimeout(()=>{
      typeInto(extText, phrase2, 40, ()=>{
        setTimeout(()=>{
          ext.classList.remove('show');
          const ab = document.getElementById('bubble-ai');
          ab.classList.add('show');
          refineDone = true;
          refining = false;
          document.getElementById('tapcatch').style.display='block';
        }, 900);
      });
    }, 350);
  }

  const scrollArea = document.getElementById('scroll-area');
  scrollArea.addEventListener('scroll', ()=>{
    if(stage!==3) return;
    const max = scrollArea.scrollHeight - scrollArea.clientHeight;
    if(max<=0) return;
    const ratio = scrollArea.scrollTop / max;
    if(ratio > 0.4 && !refineTriggered && !refineDone){
      refineTriggered = true;
      startRefine();
    }
  });

  function nextStage(){
    if(stage===1){ toStage2(); }
    else if(stage===2){ onTapCatch(); }
    else if(stage===3){
      if(!refineDone){ startRefine(); }
      else { onTapCatch(); }
    }
  }
  function prevStage(){
    if(stage>1){
      stage -= 1;
      showOnly(stage);
      if(stage===3){
        document.getElementById('outside-bubble').classList.remove('show');
        document.getElementById('bubble-ai').classList.remove('show');
        document.getElementById('scroll-area').scrollTop = 0;
        refineDone=false; refineTriggered=false; refining=false;
      }
    }
  }
  function restart(){
    stage=1;
    refineDone=false; refineTriggered=false; refining=false;
    document.getElementById('outside-bubble').classList.remove('show');
    document.getElementById('bubble-ai').classList.remove('show');
    document.getElementById('scroll-area').scrollTop = 0;
    showOnly(1);
  }

  showOnly(1);
</script>
</body>
</html>
